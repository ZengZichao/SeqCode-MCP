[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqcode-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for the SeqCode Registry database"
readme = "README_en.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SeqCode-MCP Contributors"},
]
keywords = ["mcp", "seqcode", "bioinformatics", "taxonomy", "prokaryotes", "nomenclature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
seqcode-mcp = "seqcode_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/SeqCode-MCP"
Repository = "https://github.com/ZengZichao/SeqCode-MCP"
SeqCode = "https://registry.seqco.de/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
